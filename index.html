<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GST Calculator Pro</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#38bdf8">

</head>

<body>

<div class="container">
  <h1>GST Calculator</h1>

  <div class="card">

    <label>Amount</label>
    <input id="amount" type="number" placeholder="Enter amount">

    <label>Transaction Type</label>
    <select id="type">
      <option value="intra">CGST + SGST</option>
      <option value="inter">IGST</option>
    </select>

    <label>GST %</label>
    <select id="rate">
      <option value="5">5%</option>
      <option value="12">12%</option>
      <option value="18" selected>18%</option>
      <option value="28">28%</option>
    </select>

    <label>Calculation Type</label>
    <select id="mode">
      <option value="exclusive">Add GST (Exclusive)</option>
      <option value="inclusive">Remove GST (Inclusive)</option>
    </select>

    <div class="buttons">
      <div id="result instantly"></div>
      <button id="clear" class="secondary">Clear</button>
      <div class="history" id="history"></div>
    </div>

   <button id="installBtn" style="display:none;margin-top:10px;">
      Install App
    </button>

    

  </div>
</div>

<!-- 🔥 DONATION FOOTER -->
<div class="donation-bar">
  <a class="btn paypal" href="https://paypal.me/akashkdm" target="_blank">Donate via PayPal</a>
  <a class="btn bmac" href="https://buymeacoffee.com/akashkdm" target="_blank">Buy Me A Coffee</a>
</div>

<script src="script.js" defer></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
